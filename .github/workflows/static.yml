name: Deploy Vite to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "public/adp.json"
      - "public/news.json"
      - "public/fantasypros-dynasty-values.json"
  schedule:
    - cron: "0 12 * * *"    # todos los días 12:00 UTC (cambialo si querés)
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-package-lock
      - name: Create .env (from GitHub Secrets)
        run: |
          cat > .env <<'EOF'
          VITE_GH_OWNER=fantasytrades
          VITE_GH_REPO=fantasytrades.github.io
          VITE_GH_BRANCH=main
          VITE_GH_TOKEN=${{ secrets.VITE_GH_TOKEN }}
          VITE_FIREBASE_API_KEY=AIzaSyCDOOwEbbXDio00xSnRg7pGYnzs51bZ1vE
          VITE_FIREBASE_PROJECT_ID=fantasy-trades-d992a
          VITE_FIREBASE_APP_ID=1:111630512150:web:9c379e792b0d40e1fb8537
          EOF
      # --- 1) Actualiza JSON generados (ADP + News + FantasyPros) ---
      - name: Update generated data
        run: npm run prebuild
      # --- 2) Commit de JSON generados si cambiaron ---
      - name: Commit generated JSON (if changed)
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/adp.json public/news.json public/fantasypros-dynasty-values.json
          if git diff --cached --quiet; then
            echo "No generated JSON changes"
            exit 0
          fi

          git commit -m "chore: update generated data [skip ci]" || true

          # trae cambios remotos y rebasea tu commit encima
          git pull --rebase origin main || (git rebase --abort || true)

          # intenta pushear; si no se puede, no frena el build/deploy
          git push origin HEAD:main || echo "Push rejected (fetch first). Skipping push."
    
      # --- 3) Build ---
      - name: Build
        run: npx vite build
      # --- 4) Upload artifact para Pages ---
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
